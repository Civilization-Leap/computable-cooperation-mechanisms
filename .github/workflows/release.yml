name: release

on:
  push:
    branches: [main]
    paths:
      - RELEASE_VERSION
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify release version agreement
        run: |
          python - <<'PY'
          import pathlib, tomllib
          import mechanism_ref
          release = pathlib.Path('RELEASE_VERSION').read_text(encoding='utf-8').strip()
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          package = project['project']['version']
          runtime = mechanism_ref.__version__
          assert release, 'RELEASE_VERSION is empty'
          assert package == release, (package, release)
          assert runtime == release, (runtime, release)
          notes = pathlib.Path(f'docs/RELEASE_NOTES_v{release}.md')
          assert notes.is_file(), notes
          print(f'version agreement: {release}')
          print(f'release notes: {notes}')
          PY
      - name: Run unit tests with warnings as errors
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Run teaching examples
        run: |
          tmpdir="$(mktemp -d)"
          python -m mechanism_ref examples/shared_equipment_ok.json --out-dir "$tmpdir"
          python -m mechanism_ref examples/shared_equipment_third_party_violation.json --out-dir "$tmpdir"
          python -m mechanism_ref examples/shared_equipment_unknown.json --out-dir "$tmpdir"
          python -m mechanism_ref examples/shared_equipment_capacity_violation.json --out-dir "$tmpdir"
      - name: Run offline reproduction path
        run: python scripts/reproduce_offline.py
      - name: Verify release-boundary files
        run: |
          version="$(tr -d '[:space:]' < RELEASE_VERSION)"
          notes="docs/RELEASE_NOTES_v${version}.md"
          test -f LICENSE
          test -f LICENSE_SCOPE.md
          test -f CONTRIBUTING.md
          test -f "$notes"
          test ! -e LICENSE-PENDING.txt
          grep -F "deterministic checks of declared inputs and declared constraints only" "$notes"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create exact-commit tag, offline bundle, and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < RELEASE_VERSION)"
          tag="v${version}"
          notes="docs/RELEASE_NOTES_${tag}.md"
          bundle="computable-cooperation-mechanisms-${tag}-offline.tar.gz"
          checksum="${bundle}.sha256"

          test -f "$notes"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; no action needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            tagged="$(git rev-list -n 1 "$tag")"
            test "$tagged" = "$GITHUB_SHA"
          else
            git tag -a "$tag" "$GITHUB_SHA" -m "$tag — Open-Source Milestone Release"
            git push origin "$tag"
          fi

          git archive \
            --format=tar.gz \
            --prefix="computable-cooperation-mechanisms-${tag}/" \
            --output="$bundle" \
            "$GITHUB_SHA"
          sha256sum "$bundle" > "$checksum"

          gh release create "$tag" "$bundle" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag — Reproducibility and External-Testing Milestone" \
            --notes-file "$notes" \
            --verify-tag
