name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests with warnings as errors
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Run teaching examples
        run: |
          tmpdir="$(mktemp -d)"
          python -m mechanism_ref examples/shared_equipment_ok.json --out-dir "$tmpdir"
          python -m mechanism_ref examples/shared_equipment_third_party_violation.json --out-dir "$tmpdir"
          python -m mechanism_ref examples/shared_equipment_unknown.json --out-dir "$tmpdir"
          python -m mechanism_ref examples/shared_equipment_capacity_violation.json --out-dir "$tmpdir"
      - name: Run offline reproduction path
        run: python scripts/reproduce_offline.py

  real-gc-01-reader-entry:
    name: R1 reader entry (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fresh clone, fixed checkout and verbatim README Python commands
        run: python scripts/check_real_gc_01_entry.py --run
